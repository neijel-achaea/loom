# Keeps dist/versions.json in step with the built packages on main.
# LOOM UPDATES reads that file in game to tell which packages are outdated.
name: versions
on:
  push:
    branches: [main]
    paths: ["dist/*.nxs", "tools/versions.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/versions.py
      - name: Commit if changed
        run: |
          if git diff --quiet dist/versions.json; then echo "up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/versions.json
          git commit -m "dist: versions.json"
          git push
